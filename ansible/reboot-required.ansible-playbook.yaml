#!/usr/bin/env -S uv run ansible-playbook

# Ansible Playbook Refs:
# - Syntax: https://docs.ansible.com/ansible/latest/user_guide/playbooks_intro.html#playbook-syntax
# - Collection Index: https://docs.ansible.com/ansible/latest/collections/index.html
# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/schemas/main/f/ansible.json#/$defs/playbook

# This playbook reboots specific machines in my homelab and is designed to:
#   - Gracefully reboot nodes when they are safe to be rebooted & the applications can recover automatically after reboot
#   - Wait on each rebooted node before continuing to the next one

- name: Reboot docker-servers
  hosts: docker_servers
  serial: 1
  tasks:
    - name: Reboot systems that use dnf if needed
      when: ansible_facts['pkg_mgr'] == "dnf5"
      block:
        # ref: https://dnf-plugins-core.readthedocs.io/en/latest/needs_restarting.html
        - name: Install tool to check if reboot is required
          become: true
          ansible.builtin.dnf:
            name: dnf-plugins-core
            state: present
        - name: Check if reboot needed
          become: true
          register: check_restart
          ansible.builtin.command:
            cmd: dnf needs-restarting -r
          ignore_errors: true
          changed_when: check_restart.rc != 0
        - become: true
          ansible.builtin.reboot:
          when: check_restart.rc != 0

- name: Reboot Kubernetes control-plane
  hosts: k8s-ctr
  serial: 1
  tasks:
    - name: Reboot systems that use dnf if needed
      when: ansible_facts['pkg_mgr'] == "dnf5"
      block:
        # ref: https://dnf-plugins-core.readthedocs.io/en/latest/needs_restarting.html
        - name: Install tool to check if reboot is required
          become: true
          ansible.builtin.dnf:
            name: dnf-plugins-core
            state: present
        - name: Check if reboot needed
          become: true
          register: check_restart
          ansible.builtin.command:
            cmd: dnf needs-restarting -r
          ignore_errors: true
          changed_when: check_restart.rc != 0
        - become: true
          ansible.builtin.reboot:
          when: check_restart.rc != 0
        - name: Wait for service 'k0scontroller.service' to be running
          ansible.builtin.service_facts:
          register: result
          until: result.ansible_facts.services['k0scontroller.service'].state == 'running'
          retries: 10
          delay: 5
