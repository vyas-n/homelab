
[env]
ANSIBLE_CONFIG = "{{ config_root }}/ansible/ansible.cfg"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64"]
experimental = true
python.uv_venv_auto = true
idiomatic_version_file_enable_tools = ["terraform", "python"]
npm.bun = true

[tools]
# Core tools
"core:node" = "latest"
"core:bun" = "latest"

# Packages
## Preferred
"packslip:github.com/jdx/fnox" = "latest"
"packslip:github.com/jdx/usage" = "latest"
## 2nd Preferred
"aqua:argoproj/argo-cd" = "latest"
"aqua:astral-sh/uv" = "latest"
"aqua:casey/just" = "latest"
"aqua:cert-manager/cmctl" = "latest"
"aqua:j178/prek" = "latest"
"aqua:k0sproject/k0sctl" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:suzuki-shunsuke/pinact" = "latest"
"aqua:terraform-docs/terraform-docs" = "latest"
"aqua:terraform-linters/tflint" = "latest"
"aqua:zizmorcore/zizmor" = "latest"

"github:akuity/kargo" = "latest"
## Language Specific Packages
"npm:prettier" = "latest"
"npm:markdown-table-formatter" = "latest"
