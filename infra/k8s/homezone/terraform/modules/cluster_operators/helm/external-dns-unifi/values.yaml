---
# External DNS Ref: https://artifacthub.io/packages/helm/external-dns/external-dns
# yaml-language-server: $schema=https://github.com/kubernetes-sigs/external-dns/raw/refs/heads/master/charts/external-dns/values.schema.json

logLevel: &logLevel debug
provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/kashalls/external-dns-unifi-webhook
      tag: v0.6.2 # TODO: automate updating this tag with releases: https://github.com/kashalls/external-dns-unifi-webhook/releases
    env:
      - name: LOG_LEVEL
        value: *logLevel
    livenessProbe:
      httpGet:
        path: /healthz
        port: http-webhook
      initialDelaySeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /readyz
        port: http-webhook
      initialDelaySeconds: 10
      timeoutSeconds: 5
extraArgs:
  - --ignore-ingress-tls-spec
policy: sync
sources: ["ingress", "service"]
txtOwnerId: default
txtPrefix: k8s.
domainFilters: ["svc.vyas-n.dev"] # replace with your domain

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 96Mi
    ephemeral-storage: 128Mi
