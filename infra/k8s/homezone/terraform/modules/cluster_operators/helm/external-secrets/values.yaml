---
# External Secrets Ref: https://artifacthub.io/packages/helm/external-secrets-operator/external-secrets
# yaml-language-server: $schema=https://github.com/external-secrets/external-secrets/raw/refs/heads/main/deploy/charts/external-secrets/values.schema.json
installCRDs: true

serviceMonitor:
  enabled: true
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 128Mi

webhook:
  serviceMonitor:
    enabled: true
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi
      ephemeral-storage: 128Mi

certController:
  serviceMonitor:
    enabled: true
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 30m
      memory: 128Mi
      ephemeral-storage: 128Mi
