---
# Dependabot Config: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker-compose
    directories:
      - infra/docker-server/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns:
          - "*"
  - package-ecosystem: terraform
    directories:
      - infra/digitalocean/**/terraform
      - infra/k8s/**/terraform
      - infra/k8s/**/modules/*
      - infra/proxmox/**/terraform
      - infra/proxmox/**/modules/*
      - infra/tailscale/terraform
      - infra/tfcloud/terraform
      - infra/unifi/terraform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform-remote-exec:
        patterns:
          - "*"
  - package-ecosystem: terraform
    directories:
      - infra/secrets/terraform
      - infra/secrets/terraform/modules/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform-local-exec:
        patterns:
          - "*"
    ignore:
      # Cloudflare provider version 5 doesn't have a clear upgrade path from version 4.
      - dependency-name: cloudflare/cloudflare
        update-types:
          - version-update:semver-major
      # 1Password provider version 3 doesn't support using the op cli for authentication into Private Vault.
      - dependency-name: cloudflare/cloudflare
        update-types:
          - version-update:semver-major
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      devcontainers:
        patterns:
          - "*"
