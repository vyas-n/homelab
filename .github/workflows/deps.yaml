---
# GitHub Actions Workflows Ref: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
name: Dependencies
"on":
  workflow_dispatch:
  schedule:
    # ref: https://crontab.guru/#0_4_*_*_*
    - cron: 0 4 * * *
concurrency:
  group: ${{ github.event_name }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          mount-docker-socket: true
          token: ${{ secrets.RENOVATE_GITHUB_TOKEN }}
